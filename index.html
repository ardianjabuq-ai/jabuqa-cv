/* ELITE EXECUTIVE A4 SHEET (2-Column Grid Layout) */
        .a4-sheet {
            width: 100%;
            max-width: 680px;
            min-height: 960px;
            background: #ffffff;
            color: #111827;
            padding: 40px;
            border-radius: 2px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .a4-top-header {
            border-bottom: 3px solid var(--swiss-red);
            padding-bottom: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .a4-name { font-size: 1.6rem; font-weight: 700; color: #111827; letter-spacing: -0.02em; }
        .a4-title-role { font-size: 0.88rem; font-weight: 600; color: var(--swiss-red); text-transform: uppercase; margin-top: 2px; }

        /* CV photo (optional) */
        #doc-photo { float: right; }
        #btn-remove-photo { margin-top: 8px; }

        .a4-grid-layout {
            display: grid;
            grid-template-columns: 27% 1fr;
            gap: 24px;
        }

        .a4-sidebar {
            background: var(--sidebar-bg, #f7f8fa);
            border-right: 1px solid #e2e8f0;
            padding-left: 3mm;
            padding-right: 12px;
        }

        .a4-sidebar-section { margin-bottom: 14px; }
        .a4-sidebar-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #111827;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        .a4-sidebar-content { font-size: 0.78rem; color: #334155; line-height: 1.4; overflow-wrap: anywhere; word-break: normal; }

        .a4-main-content h3 {
            color: var(--swiss-red);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 3px;
            margin-top: 14px;
            margin-bottom: 8px;
        }
        .a4-main-content p { margin-bottom: 6px; }
        .a4-main-content ul { padding-left: 14px; margin-bottom: 8px; }
        .a4-main-content li { margin-bottom: 3px; }

        /* ===== PRINT LAYOUT (only .a4-sheet is printed) ===== */
        @media print {
            /* Hide the application chrome; print only the CV sheet */
            .topbar,
            .editor-pane,
            .preview-toolbar,
            .btn-generate,
            .btn-small,
            .lang-switcher { display: none !important; }

            /* Flatten wrapper containers so nothing clips or squeezes the CV */
            body { margin: 0; padding: 0; overflow: visible; width: auto; height: auto; min-height: auto; background: #fff; }
            .workspace { display: block; grid: none; max-width: none; width: auto; height: auto; min-height: auto; overflow: visible; border: none; margin: 0; padding: 0; }
            .preview-pane { display: block; position: static; float: none; width: auto; height: auto; min-height: auto; max-height: none; overflow: visible; background: transparent; padding: 0; border: none; box-shadow: none; margin: 0; }

            /* A4 sheet fills the printable width, flows across pages, no clipping */
            .a4-sheet {
                display: block !important;
                width: 100% !important;
                max-width: none !important;
                min-height: auto !important;
                height: auto !important;
                padding: 16mm !important;
                margin: 0 auto !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: #fff !important;
                overflow: visible !important;
                transform: none !important;
                page-break-inside: auto;
            }

            /* Keep CV section structure intact but allow page breaks between blocks */
            .a4-grid-layout { width: 100%; page-break-inside: auto; }
            .a4-sidebar, .a4-main-content { page-break-inside: auto; }
            .a4-top-header, .a4-sidebar-section, .a4-main-content h3, .a4-main-content p, .a4-main-content ul { page-break-inside: avoid; }

            /* Print background colors/borders (Swiss red accents) */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

            /* Photo: visible in print only when a photo is set; remove button hidden */
            #doc-photo[src]:not([src=""]) { display: block !important; float: right !important; }
            #doc-photo:not([src]), #doc-photo[src=""] { display: none !important; }
            #btn-remove-photo { display: none !important; }
        }
